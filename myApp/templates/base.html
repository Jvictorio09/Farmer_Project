<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Farmer Dashboard{% endblock %}</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1"></script>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  </head>
  <body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col">
    {% include 'includes/header.html' %}

    <div id="flash-region"
         class="flex-shrink-0"
         hx-get="{% url 'flash_messages' %}"
         hx-trigger="flash-refresh from:body"
         hx-target="this"
         hx-swap="innerHTML">
      {% include 'partials/flash_messages.html' %}
    </div>

    <main class="flex-grow">
      {% block content %}{% endblock %}
    </main>

    {% include 'includes/footer.html' %}
    {% include 'partials/confirm_texts.html' %}

    <div id="agri-confirm-modal"
         class="fixed inset-0 z-50 hidden items-center justify-center bg-black/50 px-4"
         role="dialog"
         aria-modal="true"
         aria-labelledby="agri-confirm-title">
      <div class="w-full max-w-md rounded-lg bg-white shadow-xl">
        <div class="px-5 py-4 border-b">
          <h3 id="agri-confirm-title" class="text-lg font-semibold text-gray-800"></h3>
        </div>
        <div class="px-5 py-4 text-sm text-gray-600" id="agri-confirm-body"></div>
        <div class="flex justify-end gap-2 border-t px-5 py-4">
          <button type="button"
                  id="agri-confirm-cancel"
                  class="rounded-md border border-gray-200 px-4 py-2 text-sm font-medium text-gray-600 hover:bg-gray-50">
            Cancel
          </button>
          <button type="button"
                  id="agri-confirm-accept"
                  class="rounded-md bg-green-600 px-4 py-2 text-sm font-semibold text-white hover:bg-green-700">
            Confirm
          </button>
        </div>
      </div>
    </div>
    
    <script>
    // Toggle crop recommendations dropdown
    function toggleCropRecommendations() {
      const content = document.getElementById('cropRecContent');
      const toggle = document.getElementById('cropRecToggle');
      const icon = document.getElementById('cropRecIcon');
      
      if (content && toggle && icon) {
        const isHidden = content.classList.contains('hidden');
        
        if (isHidden) {
          content.classList.remove('hidden');
          toggle.setAttribute('aria-expanded', 'true');
          icon.style.transform = 'rotate(180deg)';
        } else {
          content.classList.add('hidden');
          toggle.setAttribute('aria-expanded', 'false');
          icon.style.transform = 'rotate(0deg)';
        }
      }
    }
    
      lucide.createIcons(); // auto-replace <i data-lucide="">

      (function () {
        const modal = document.getElementById('agri-confirm-modal');
        if (!modal) return;
        const titleEl = document.getElementById('agri-confirm-title');
        const bodyEl = document.getElementById('agri-confirm-body');
        const cancelBtn = document.getElementById('agri-confirm-cancel');
        const acceptBtn = document.getElementById('agri-confirm-accept');

        let pendingSubmit = null;

        const toggleModal = (show) => {
          modal.classList.toggle('hidden', !show);
          modal.classList.toggle('flex', show);
          if (!show) {
            pendingSubmit = null;
          }
        };

        const focusAccept = () => {
          window.requestAnimationFrame(() => acceptBtn.focus());
        };

        document.addEventListener('submit', (evt) => {
          const form = evt.target;
          const confirmType = form?.dataset?.confirm;
          if (!confirmType) return;

          const copy = window.AgriplusConfirmCopy?.[confirmType];
          if (!copy) return;

          evt.preventDefault();
          titleEl.textContent = copy.title;
          bodyEl.textContent = copy.body;
          cancelBtn.textContent = copy.cancel || 'Cancel';
          acceptBtn.textContent = copy.confirm || 'Confirm';

          pendingSubmit = form;
          toggleModal(true);
          focusAccept();
        }, true);

        cancelBtn.addEventListener('click', () => toggleModal(false));
        modal.addEventListener('click', (evt) => {
          if (evt.target === modal) toggleModal(false);
        });
        document.addEventListener('keydown', (evt) => {
          if (evt.key === 'Escape' && !modal.classList.contains('hidden')) {
            evt.preventDefault();
            toggleModal(false);
          }
        });
        acceptBtn.addEventListener('click', () => {
          if (!pendingSubmit) return;
          const form = pendingSubmit;
          const confirmType = form.getAttribute('data-confirm');
          toggleModal(false);
          form.removeAttribute('data-confirm');
          form.submit();
          window.requestAnimationFrame(() => {
            if (form && confirmType) {
              form.setAttribute('data-confirm', confirmType);
            }
          });
        });
      })();

      // Notification bell dropdown functionality
      function toggleNotificationDropdown(event) {
        if (event) {
          event.stopPropagation();
        }
        
        const dropdown = document.getElementById('notification-dropdown');
        const dropdownMobile = document.getElementById('notification-dropdown-mobile');
        const bell = document.getElementById('notification-bell');
        const bellMobile = document.getElementById('notification-bell-mobile');
        
        // Determine which dropdown to toggle based on which button was clicked or which dropdown contains the close button
        let isMobile = false;
        let isCloseButton = false;
        
        if (event && event.target) {
          // Check if clicking close button inside dropdown
          if (dropdown && dropdown.contains(event.target) && !bell.contains(event.target)) {
            isCloseButton = true;
            dropdown.classList.add('hidden');
            return;
          }
          if (dropdownMobile && dropdownMobile.contains(event.target) && !bellMobile.contains(event.target)) {
            isCloseButton = true;
            dropdownMobile.classList.add('hidden');
            return;
          }
          
          // Check which bell button was clicked
          isMobile = event.target.closest('#notification-bell-mobile') !== null || 
                    event.target === bellMobile ||
                    (bellMobile && bellMobile.contains(event.target));
        }
        
        // Toggle the appropriate dropdown
        if (isMobile && dropdownMobile) {
          // Toggle mobile dropdown
          dropdownMobile.classList.toggle('hidden');
          // Close desktop dropdown if open
          if (dropdown) {
            dropdown.classList.add('hidden');
          }
        } else if (dropdown) {
          // Toggle desktop dropdown
          dropdown.classList.toggle('hidden');
          // Close mobile dropdown if open
          if (dropdownMobile) {
            dropdownMobile.classList.add('hidden');
          }
        }
        
        // Close mobile menu if open
        closeMobileMenu();
      }
      
      // Close dropdown when clicking outside
      document.addEventListener('click', function(event) {
        const bell = document.getElementById('notification-bell');
        const bellMobile = document.getElementById('notification-bell-mobile');
        const dropdown = document.getElementById('notification-dropdown');
        const dropdownMobile = document.getElementById('notification-dropdown-mobile');
        
        // Check if click is on bell button or inside dropdown
        const clickedOnBell = (bell && bell.contains(event.target)) || (bellMobile && bellMobile.contains(event.target));
        const clickedInDropdown = (dropdown && dropdown.contains(event.target)) || (dropdownMobile && dropdownMobile.contains(event.target));
        
        // Close desktop dropdown if click is outside
        if (dropdown && !clickedOnBell && !clickedInDropdown) {
          dropdown.classList.add('hidden');
        }
        
        // Close mobile dropdown if click is outside
        if (dropdownMobile && !clickedOnBell && !clickedInDropdown) {
          dropdownMobile.classList.add('hidden');
        }
      });
      
      // Mobile menu toggle
      function toggleMobileMenu() {
        const menu = document.getElementById('mobile-menu');
        const toggle = document.getElementById('mobile-menu-toggle');
        const icon = document.getElementById('mobile-menu-icon');
        const closeIcon = document.getElementById('mobile-menu-close');
        
        if (menu && toggle && icon && closeIcon) {
          const isHidden = menu.classList.contains('hidden');
          
          if (isHidden) {
            menu.classList.remove('hidden');
            toggle.setAttribute('aria-expanded', 'true');
            icon.classList.add('hidden');
            closeIcon.classList.remove('hidden');
          } else {
            menu.classList.add('hidden');
            toggle.setAttribute('aria-expanded', 'false');
            icon.classList.remove('hidden');
            closeIcon.classList.add('hidden');
          }
        }
      }
      
      function closeMobileMenu() {
        const menu = document.getElementById('mobile-menu');
        const toggle = document.getElementById('mobile-menu-toggle');
        const icon = document.getElementById('mobile-menu-icon');
        const closeIcon = document.getElementById('mobile-menu-close');
        
        if (menu && toggle && icon && closeIcon) {
          menu.classList.add('hidden');
          toggle.setAttribute('aria-expanded', 'false');
          icon.classList.remove('hidden');
          closeIcon.classList.add('hidden');
        }
      }
      
      // Close mobile menu when clicking outside
      document.addEventListener('click', function(event) {
        const menu = document.getElementById('mobile-menu');
        const toggle = document.getElementById('mobile-menu-toggle');
        
        if (menu && toggle && !menu.contains(event.target) && !toggle.contains(event.target)) {
          if (!menu.classList.contains('hidden')) {
            closeMobileMenu();
          }
        }
      });
    </script>
  </body>
</html>
